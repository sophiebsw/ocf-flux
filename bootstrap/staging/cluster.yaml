apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cluster
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: staging
  secretRef:
    name: flux-system
  url: ssh://git@github.com/sophiebsw/ocf-flux
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster/staging
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  patches:
    - target:
        kind: Kustomization 
      patch: |
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: ignored
          namespace: flux-system
          labels:
            ocf.berkeley.edu/cluster: staging
        spec:
          decryption:
            provider: sops
