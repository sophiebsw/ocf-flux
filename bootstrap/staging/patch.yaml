apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ignored
  namespace: flux-system
  labels:
    ocf.berkeley.edu/cluster: staging
spec:
  decryption:
    provider: sops
  patches: # TODO surely there's a better way
    - target:
        kind: Deployment
      patch: |
        apiVersion: v1
        kind: Deployment
        metadata:
          name: ignored
          labels: 
            ocf.berkeley.edu/cluster: staging
